  function fail(){m.innerHTML='<b>This link is incomplete</b>Please use the full link you received from The Superoptimal, including everything after the # sign.';}
  try{
    var k=location.hash.slice(1); if(!k) return fail();
    function d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
    var key=await crypto.subtle.importKey('raw',d(k),'AES-GCM',false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d('KWoBG2vkBXeWSQ2a')},key,d(document.getElementById('c').textContent.trim()));
    var h=new TextDecoder().decode(pt);
    if(document.readyState==='loading'){await new Promise(function(r){document.addEventListener('DOMContentLoaded',r)});}
    document.open();document.write(h);document.close();
  }catch(e){fail();}
})();
</script>
</body></html>
